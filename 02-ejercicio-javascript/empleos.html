<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explora miles de oportunidades en el sector tecnológico. ">
    <title>Resultados de Búsqueda</title>
    <link rel="stylesheet" href="assets/styles.css">
    <script type="module" src="assets/scripts/main.js"></script>
    <!-- <script type="module" src="assets/scripts/search.js"></script> -->
</head>
<body>
    <header class="main-header bg-ultra-dark">
            <h1 class="logo">
                <svg
                    height="36"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                DevJobs
            </h1>
            <nav class="menu-nav">
                <a href="index.html">Inicio</a>
                <a href="empleos.html" aria-current="page">Empleos</a>
                <a href="#">Empresas</a>
                <a href="#">Salarios</a>
            </nav>
            <div class="session-nav">
                <a class="btn bg-dark" href="">Subir CV</a>
                <a href=""><img class="profile-pic" src="assets/images/PP.jpg" alt="Foto de Perfil" width="60" height="60"></a>
            </div>
    </header>
    <main>
        <section  class="section-margin">
            <h1>Encuentra tu próximo trabajo</h1>
            <p class="p-margin">Explora miles de oportunidades en el sector tecnológico.</p>
            <form id="search-form" class="search-form" role="search" action="">
                <div class="search-form__bar">
                    <label for="search-form__input" class="screen-reader-only">Buscar</label>
                    <input type="text" name="search" id="search-form__input" class="search-form__input" placeholder="Buscar trabajos, empresas o habilidades">
                    <button type="submit" aria-label="Buscar" class="search-form__button">🔍</button>
                </div>
                <div class="search-form__filters">
                    <div class="search-form__filters__item">
                        <label for="technology-filter" class="screen-reader-only">Filtrar por tipo de contrato</label>
                        <select name="technology" id="technology-filter" class="technology-filter">
                            <option value="">Tecnología</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                            <option value="C#">C#</option>
                            <option value="Ruby">Ruby</option>
                        </select>
                    </div>
                    <div class="search-form__filters__item">
                        <label for="location-filter" class="screen-reader-only">Filtrar por ubicación</label>
                        <select name="location" id="location-filter" class="location-filter">
                            <option value="">Ubicación</option>
                            <option value="Remoto">Remoto</option>
                            <option value="Madrid">Madrid</option>
                            <option value="Barcelona">Barcelona</option>
                            <option value="Valencia">Valencia</option>
                            <option value="Sevilla">Sevilla</option>
                        </select>
                    </div>
                    <div class="search-form__filters__item">
                        <label for="contract-type-filter" class="screen-reader-only">Filtrar por tipo de contrato</label>
                        <select name="contract" id="contract-type-filter" class="contract-type-filter">
                            <option value="">Tipo de contrato</option>
                            <option value="Tiempo completo">Tiempo completo</option>
                            <option value="Medio tiempo">Medio tiempo</option>
                            <option value="Contrato">Contrato</option>
                            <option value="Freelance">Freelance</option>
                            <option value="Pasantía">Pasantía</option>
                        </select>
                    </div>
                    <div class="search-form__filters__item ">
                        <label for="experience-level-filter" class="screen-reader-only">Filtrar por nivel de experiencia</label>
                        <select name="experience" id="experience-level-filter" class="experience-level-filter">
                            <option value="">Nivel de experiencia</option>
                            <option value="Trainee">Trainee</option>
                            <option value="Junior">Junior</option>
                            <option value="Mid">Semi-Senior</option>
                            <option value="Lead">Leader</option>
                            <option value="Senior">Senior</option>
                        </select>
                    </div>
                </div>
            </form>
        </section>
        <section class="search-results-section">
            <h2>Resultados de búsqueda</h2>
            <ul id="search-results" class="search-results">
                <!-- Results go here -->
            </ul>
            <nav>   
                <ul id="pagination" class="pagination flex-row">
                    <!-- Pagination goes here -->
                </ul>
            </nav>
        </section>
    </main>
    <footer class="main-footer">
        <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
        <small class="">Sitio creado con 💙 por <a href="https://www.paosofiam.com">Paola Sofía Mendoza</a></small>
    </footer>
</body>
</html>
